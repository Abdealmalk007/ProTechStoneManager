name: Build Windows Setup
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows EXE
        shell: pwsh
        run: .\build_windows.ps1
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
          }
      - name: Build installer
        shell: pwsh
        run: |
          $inno='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $inno)) { $inno='C:\Program Files\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $inno)) { throw 'ISCC.exe missing' }
          & $inno '.\installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed' }
          if (-not (Test-Path '.\Release\Setup.exe')) { throw 'Setup.exe missing' }
      - name: Generate checksums
        shell: pwsh
        run: |
          $hash=(Get-FileHash '.\Release\Setup.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  Setup.exe" | Out-File -Encoding ascii '.\Release\SHA256SUMS.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: ProTechStoneManager-Setup
          path: |
            Release/Setup.exe
            Release/SHA256SUMS.txt
      - name: Prevent unsigned release
        shell: pwsh
        run: |
          & ./tools/Test-WindowsReleaseSignature.ps1 -Path './Release/Setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned installer: no public GitHub Release permitted.' }
      - name: Publication
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Write-Host 'Release remains manual after signing and Authenticode checks.'